# SPDX-License-Identifier: 0BSD
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build development image
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          load: true
          tags: pico-sdcard-bootloader-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Use the Dockerfile directly so CI does not need USB devices or editor features.
      - name: Build bootloader
        run: |
          docker run --rm \
            --volume "${PWD}:/workspaces/bootloader" \
            --workdir /workspaces/bootloader \
            pico-sdcard-bootloader-ci bash -e -c '
              # Build the deployable image with the production preset.
              cmake --preset rp2040_release
              cmake --build --preset rp2040_release
            '

      - name: Run host tests
        run: |
          docker run --rm \
            --volume "${PWD}:/workspaces/bootloader" \
            --workdir /workspaces/bootloader \
            pico-sdcard-bootloader-ci bash -e -c '
              # Build tests and their production sources in Debug.
              cmake --preset test
              cmake --build build/test --target bootloader_tests --parallel
              # Run the discovered GTest cases and retain failure details.
              ctest --test-dir build/test/test --parallel --output-on-failure
            '

      - name: Upload bootloader
        uses: actions/upload-artifact@v4
        with:
          name: bootloader
          path: |
            build/rp2040_release/src/boot3/bootloader.uf2
            build/rp2040_release/src/boot3/bootloader.elf
          if-no-files-found: error
